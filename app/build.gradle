plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tslaundry.cashlog'
    compileSdk 34

    defaultConfig {
        applicationId "com.tslaundry.cashlog"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "2.4"
    }

    // Fixed signing key: every build is signed the same way,
    // so new versions install OVER the old one and keep the data.
    signingConfigs {
        debug {
            storeFile file('laundrycash.jks')
            storePassword 'laundry123'
            keyAlias 'laundrycash'
            keyPassword 'laundry123'
        }
        release {
            storeFile file('laundrycash.jks')
            storePassword 'laundry123'
            keyAlias 'laundrycash'
            keyPassword 'laundry123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
